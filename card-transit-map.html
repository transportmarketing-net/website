<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexandros Kourtis — Transport Marketing (Transit Map)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #111;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            width: 340px;
            height: 460px;
            background: #0a0a0a;
            border-radius: 16px;
            padding: 36px 32px 28px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.06),
                0 20px 60px rgba(0,0,0,0.5);
        }

        /* Transit map SVG background */
        .transit-bg {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.12;
        }

        .transit-bg svg {
            width: 100%;
            height: 100%;
        }

        /* Content layered above */
        .card > *:not(.transit-bg) {
            position: relative;
            z-index: 1;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .logo-dots {
            display: flex;
            gap: 5px;
        }

        .logo-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .logo-dot--blue { background: #4285f4; }
        .logo-dot--red { background: #ea4335; }
        .logo-dot--green { background: #34a853; }

        .tm-mark {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            color: rgba(255,255,255,0.2);
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .brand-hero {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-bottom: 24px;
        }

        .brand-line {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            line-height: 1;
        }

        /* Station-style info rows */
        .info-block {
            display: flex;
            flex-direction: column;
            gap: 0;
            margin-left: 6px;
            position: relative;
        }

        /* Vertical line connecting stations */
        .info-block::before {
            content: '';
            position: absolute;
            left: 4px;
            top: 8px;
            bottom: 8px;
            width: 2px;
            background: linear-gradient(to bottom, #4285f4, #ea4335, #34a853);
            border-radius: 1px;
        }

        .station {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 0;
            text-decoration: none;
            color: rgba(255,255,255,0.55);
            font-size: 0.78rem;
            transition: color 0.2s;
        }

        .station:hover { color: rgba(255,255,255,0.85); }

        .station-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid;
            background: #0a0a0a;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .station:nth-child(1) .station-dot { border-color: #4285f4; }
        .station:nth-child(2) .station-dot { border-color: #ea4335; }
        .station:nth-child(3) .station-dot { border-color: #34a853; }

        .station-label {
            font-size: 0.55rem;
            color: rgba(255,255,255,0.2);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 1px;
        }

        .station-value {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
        }

        .station:hover .station-value { color: rgba(255,255,255,0.8); }

        .station-content {
            display: flex;
            flex-direction: column;
        }

        .bottom-section {
            margin-top: auto;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
        }

        .brand-mark {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .brand-name {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 0.68rem;
            font-weight: 700;
            color: rgba(255,255,255,0.2);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .brand-tagline {
            font-size: 0.58rem;
            color: rgba(255,255,255,0.12);
            letter-spacing: 0.05em;
        }

        .qr-code {
            width: 58px;
            height: 58px;
        }

        .qr-code svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Transit map background lines -->
        <div class="transit-bg">
            <svg viewBox="0 0 340 460" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Blue line: horizontal with curves -->
                <path d="M-20,80 L80,80 Q100,80 100,100 L100,200 Q100,220 120,220 L380,220" stroke="#4285f4" stroke-width="3" fill="none"/>
                <!-- Red line: diagonal -->
                <path d="M-20,350 L60,350 Q80,350 90,330 L180,140 Q190,120 210,120 L380,120" stroke="#ea4335" stroke-width="3" fill="none"/>
                <!-- Green line: sweeping curve -->
                <path d="M160,-20 L160,60 Q160,80 180,100 L260,180 Q280,200 280,220 L280,380 Q280,400 260,400 L-20,400" stroke="#34a853" stroke-width="3" fill="none"/>

                <!-- Station dots on blue line -->
                <circle cx="80" cy="80" r="5" fill="#0a0a0a" stroke="#4285f4" stroke-width="2"/>
                <circle cx="100" cy="150" r="4" fill="#0a0a0a" stroke="#4285f4" stroke-width="2"/>

                <!-- Station dots on red line -->
                <circle cx="140" cy="230" r="5" fill="#0a0a0a" stroke="#ea4335" stroke-width="2"/>
                <circle cx="210" cy="120" r="4" fill="#0a0a0a" stroke="#ea4335" stroke-width="2"/>

                <!-- Station dots on green line -->
                <circle cx="220" cy="140" r="5" fill="#0a0a0a" stroke="#34a853" stroke-width="2"/>
                <circle cx="280" cy="300" r="4" fill="#0a0a0a" stroke="#34a853" stroke-width="2"/>

                <!-- Interchange circle (where lines cross) -->
                <circle cx="180" cy="140" r="8" fill="#0a0a0a" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
                <circle cx="180" cy="140" r="3" fill="rgba(255,255,255,0.2)"/>
            </svg>
        </div>

        <!-- Header -->
        <div class="header">
            <div class="logo-dots">
                <div class="logo-dot logo-dot--blue"></div>
                <div class="logo-dot logo-dot--red"></div>
                <div class="logo-dot logo-dot--green"></div>
            </div>
            <span class="tm-mark">TM</span>
        </div>

        <!-- Brand Name -->
        <div class="brand-hero">
            <span class="brand-line">Transport</span>
            <span class="brand-line">Marketing</span>
        </div>

        <!-- Contact as metro stations -->
        <div class="info-block">
            <a href="mailto:director@transportmarketing.net" class="station">
                <div class="station-dot"></div>
                <div class="station-content">
                    <span class="station-label">Email</span>
                    <span class="station-value">director@transportmarketing.net</span>
                </div>
            </a>
            <a href="tel:+306989442438" class="station">
                <div class="station-dot"></div>
                <div class="station-content">
                    <span class="station-label">Phone</span>
                    <span class="station-value">+30 698 944 2438</span>
                </div>
            </a>
            <a href="https://transportmarketing.net" class="station" target="_blank">
                <div class="station-dot"></div>
                <div class="station-content">
                    <span class="station-label">Web</span>
                    <span class="station-value">transportmarketing.net</span>
                </div>
            </a>
        </div>

        <!-- Bottom -->
        <div class="bottom-section">
            <div class="brand-mark">
                <span class="brand-name">Transport Marketing</span>
                <span class="brand-tagline">Three brands &middot; One vision</span>
            </div>
            <div class="qr-code">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 29 29" shape-rendering="crispEdges"><path stroke="#ffffff" stroke-opacity=".25" d="M0 0.5h7m3 0h2m1 0h1m2 0h1m2 0h1m2 0h7M0 1.5h1m5 0h1m1 0h2m1 0h1m2 0h7m1 0h1m5 0h1M0 2.5h1m1 0h3m1 0h1m2 0h1m3 0h2m1 0h1m1 0h1m3 0h1m1 0h3m1 0h1M0 3.5h1m1 0h3m1 0h1m3 0h1m1 0h4m2 0h2m2 0h1m1 0h3m1 0h1M0 4.5h1m1 0h3m1 0h1m1 0h1m1 0h3m1 0h1m2 0h3m2 0h1m1 0h3m1 0h1M0 5.5h1m5 0h1m6 0h1m3 0h1m1 0h2m1 0h1m5 0h1M0 6.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M10 7.5h2m1 0h2m1 0h3M0 8.5h1m1 0h1m1 0h1m1 0h1m2 0h2m3 0h2m1 0h1m1 0h2m3 0h1m2 0h1M0 9.5h1m3 0h1m2 0h1m1 0h2m1 0h1m1 0h2m4 0h1m1 0h1m2 0h1m2 0h1M1 10.5h2m3 0h3m1 0h4m3 0h1m2 0h1m1 0h1m3 0h3M1 11.5h1m1 0h1m1 0h1m4 0h1m4 0h1m1 0h1m4 0h1m1 0h1m2 0h1M2 12.5h1m3 0h4m1 0h2m3 0h2m3 0h2m2 0h1m1 0h2M1 13.5h1m2 0h1m3 0h1m3 0h2m1 0h3m2 0h1m1 0h1m2 0h1m2 0h1M1 14.5h1m1 0h1m1 0h4m3 0h1m1 0h4m4 0h4m1 0h2M0 15.5h3m5 0h1m1 0h5m1 0h4m1 0h1m1 0h1m1 0h1m1 0h1M3 16.5h4m1 0h3m3 0h2m1 0h2m1 0h3m2 0h1m1 0h2M1 17.5h3m1 0h1m6 0h1m1 0h2m4 0h3m2 0h2m1 0h1M0 18.5h1m3 0h1m1 0h2m2 0h1m2 0h1m3 0h1m3 0h1m5 0h2M1 19.5h4m2 0h2m2 0h2m2 0h1m1 0h1m1 0h2m1 0h2m1 0h1m1 0h1M0 20.5h1m1 0h6m2 0h1m1 0h1m3 0h2m1 0h6M8 21.5h3m1 0h2m1 0h2m2 0h2m3 0h1m1 0h3M0 22.5h7m4 0h2m1 0h4m1 0h2m1 0h1m1 0h2m1 0h2M0 23.5h1m5 0h1m2 0h6m1 0h2m2 0h1m3 0h2m1 0h2M0 24.5h1m1 0h3m1 0h1m1 0h3m1 0h1m1 0h4m2 0h5m2 0h1M0 25.5h1m1 0h3m1 0h1m2 0h7m1 0h1m1 0h1m4 0h1m1 0h1M0 26.5h1m1 0h3m1 0h1m1 0h2m1 0h2m3 0h1m2 0h3m1 0h3m2 0h1M0 27.5h1m5 0h1m2 0h1m2 0h7m1 0h2m1 0h1m3 0h1M0 28.5h7m1 0h2m1 0h1m2 0h1m2 0h1m1 0h2m2 0h3m1 0h2"/></svg>
            </div>
        </div>
    </div>
</body>
</html>
