<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <!-- Icon: Blue circle centered at top -->
  <circle cx="150" cy="100" r="72" fill="#4285f4"/>
  <!-- Horizontal data lines -->
  <line x1="100.5" y1="74.8" x2="199.5" y2="74.8" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round"/>
  <line x1="100.5" y1="100" x2="199.5" y2="100" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round"/>
  <line x1="100.5" y1="125.2" x2="199.5" y2="125.2" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round"/>
  <!-- Circuit nodes -->
  <circle cx="127.5" cy="74.8" r="5.4" fill="#4285f4" stroke="#FFFFFF" stroke-width="2.7"/>
  <circle cx="172.5" cy="100" r="5.4" fill="#4285f4" stroke="#FFFFFF" stroke-width="2.7"/>
  <circle cx="141" cy="125.2" r="5.4" fill="#4285f4" stroke="#FFFFFF" stroke-width="2.7"/>
  <!-- Dotted vertical connectors -->
  <line x1="127.5" y1="80.2" x2="127.5" y2="94.6" stroke="#FFFFFF" stroke-width="2.25" stroke-linecap="round" stroke-dasharray="1 4.5"/>
  <line x1="172.5" y1="105.4" x2="172.5" y2="119.8" stroke="#FFFFFF" stroke-width="2.25" stroke-linecap="round" stroke-dasharray="1 4.5"/>
  <!-- Arrows at line ends -->
  <polygon points="193.2,71.2 199.5,74.8 193.2,78.4" fill="#FFFFFF"/>
  <polygon points="193.2,96.4 199.5,100 193.2,103.6" fill="#FFFFFF"/>
  <polygon points="193.2,121.6 199.5,125.2 193.2,128.8" fill="#FFFFFF"/>
  <!-- Text: centered below icon, dark for light bg -->
  <text x="150" y="230" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#1A1A1A" text-anchor="middle">BlueLine</text>
  <text x="150" y="265" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#1A1A1A" text-anchor="middle" letter-spacing="5">SAAS &amp; SYSTEMS</text>
</svg>
