<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transit Map Outro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 2480px;
            height: 3508px;
            background: #0a0a0a;
            padding: 200px;
            position: relative;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        /* Transit map background (reduced opacity) */
        .pattern-bg {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.08;
        }
        .pattern-bg svg {
            width: 100%;
            height: 100%;
        }
        .top-section {
            text-align: center;
            margin-bottom: 400px;
            position: relative;
            z-index: 1;
        }
        .logo-dots {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-bottom: 80px;
        }
        .logo-dot {
            width: 120px;
            height: 120px;
            border-radius: 50%;
        }
        .logo-text {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 120px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        /* Station-style contact rows */
        .contact-section {
            display: flex;
            flex-direction: column;
            gap: 0;
            margin-bottom: 600px;
            margin-left: 60px;
            position: relative;
            z-index: 1;
        }
        /* Vertical line connecting stations */
        .contact-section::before {
            content: '';
            position: absolute;
            left: 30px;
            top: 60px;
            bottom: 60px;
            width: 8px;
            background: linear-gradient(to bottom, #4285f4, #ea4335, #34a853);
            border-radius: 4px;
        }
        .station-row {
            display: flex;
            align-items: center;
            gap: 80px;
            padding: 60px 0;
            position: relative;
        }
        .station-dot {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 12px solid;
            background: #0a0a0a;
            flex-shrink: 0;
            position: relative;
            z-index: 2;
        }
        .station-row:nth-child(1) .station-dot { border-color: #4285f4; }
        .station-row:nth-child(2) .station-dot { border-color: #ea4335; }
        .station-row:nth-child(3) .station-dot { border-color: #34a853; }
        .station-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .station-label {
            font-size: 38px;
            font-weight: 500;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .station-value {
            font-size: 52px;
            font-weight: 400;
            color: rgba(255,255,255,0.8);
        }
        .bottom-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            position: relative;
            z-index: 1;
        }
        .footer-text {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 60px;
            font-weight: 700;
            color: rgba(255,255,255,0.15);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .qr-code {
            width: 400px;
            height: 400px;
            background: rgba(255,255,255,0.02);
            border: 4px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <!-- Transit background -->
    <div class="pattern-bg">
        <svg viewBox="0 0 2480 3508" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M-100,800 L800,800 Q1000,800 1000,1000 L1000,1800 Q1000,2000 1200,2000 L2600,2000" stroke="#4285f4" stroke-width="15" fill="none"/>
            <path d="M-100,2600 L600,2600 Q800,2600 950,2200 L1500,1200 Q1650,800 1900,800 L2600,800" stroke="#ea4335" stroke-width="15" fill="none"/>
            <path d="M1400,-100 L1400,800 Q1400,1000 1600,1200 L2000,1600 Q2200,1800 2200,2000 L2200,3000 Q2200,3200 2000,3200 L-100,3200" stroke="#34a853" stroke-width="15" fill="none"/>
        </svg>
    </div>

    <div class="top-section">
        <div class="logo-dots">
            <div class="logo-dot" style="background: #4285f4;"></div>
            <div class="logo-dot" style="background: #ea4335;"></div>
            <div class="logo-dot" style="background: #34a853;"></div>
        </div>
        <div class="logo-text">TRANSPORT MARKETING</div>
    </div>

    <div class="contact-section">
        <div class="station-row">
            <div class="station-dot"></div>
            <div class="station-content">
                <div class="station-label">Email</div>
                <div class="station-value">director@transportmarketing.net</div>
            </div>
        </div>
        <div class="station-row">
            <div class="station-dot"></div>
            <div class="station-content">
                <div class="station-label">Phone</div>
                <div class="station-value">+30 698 944 2438</div>
            </div>
        </div>
        <div class="station-row">
            <div class="station-dot"></div>
            <div class="station-content">
                <div class="station-label">Web</div>
                <div class="station-value">transportmarketing.net</div>
            </div>
        </div>
    </div>

    <div class="bottom-section">
        <div class="footer-text">TRANSPORT MARKETING</div>
        <div class="qr-code">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 29 29" width="360" height="360" shape-rendering="crispEdges">
                <path stroke="#ffffff" stroke-opacity=".3" d="M0 0.5h7m3 0h2m1 0h1m2 0h1m2 0h1m2 0h7M0 1.5h1m5 0h1m1 0h2m1 0h1m2 0h7m1 0h1m5 0h1M0 2.5h1m1 0h3m1 0h1m2 0h1m3 0h2m1 0h1m1 0h1m3 0h1m1 0h3m1 0h1M0 3.5h1m1 0h3m1 0h1m3 0h1m1 0h4m2 0h2m2 0h1m1 0h3m1 0h1M0 4.5h1m1 0h3m1 0h1m1 0h1m1 0h3m1 0h1m2 0h3m2 0h1m1 0h3m1 0h1M0 5.5h1m5 0h1m6 0h1m3 0h1m1 0h2m1 0h1m5 0h1M0 6.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M10 7.5h2m1 0h2m1 0h3M0 8.5h1m1 0h1m1 0h1m1 0h1m2 0h2m3 0h2m1 0h1m1 0h2m3 0h1m2 0h1M0 9.5h1m3 0h1m2 0h1m1 0h2m1 0h1m1 0h2m4 0h1m1 0h1m2 0h1m2 0h1M1 10.5h2m3 0h3m1 0h4m3 0h1m2 0h1m1 0h1m3 0h3M1 11.5h1m1 0h1m1 0h1m4 0h1m4 0h1m1 0h1m4 0h1m1 0h1m2 0h1M2 12.5h1m3 0h4m1 0h2m3 0h2m3 0h2m2 0h1m1 0h2M1 13.5h1m2 0h1m3 0h1m3 0h2m1 0h3m2 0h1m1 0h1m2 0h1m2 0h1M1 14.5h1m1 0h1m1 0h4m3 0h1m1 0h4m4 0h4m1 0h2M0 15.5h3m5 0h1m1 0h5m1 0h4m1 0h1m1 0h1m1 0h1m1 0h1M3 16.5h4m1 0h3m3 0h2m1 0h2m1 0h3m2 0h1m1 0h2M1 17.5h3m1 0h1m6 0h1m1 0h2m4 0h3m2 0h2m1 0h1M0 18.5h1m3 0h1m1 0h2m2 0h1m2 0h1m3 0h1m3 0h1m5 0h2M1 19.5h4m2 0h2m2 0h2m2 0h1m1 0h1m1 0h2m1 0h2m1 0h1m1 0h1M0 20.5h1m1 0h6m2 0h1m1 0h1m3 0h2m1 0h6M8 21.5h3m1 0h2m1 0h2m2 0h2m3 0h1m1 0h3M0 22.5h7m4 0h2m1 0h4m1 0h2m1 0h1m1 0h2m1 0h2M0 23.5h1m5 0h1m2 0h6m1 0h2m2 0h1m3 0h2m1 0h2M0 24.5h1m1 0h3m1 0h1m1 0h3m1 0h1m1 0h4m2 0h5m2 0h1M0 25.5h1m1 0h3m1 0h1m2 0h7m1 0h1m1 0h1m4 0h1m1 0h1M0 26.5h1m1 0h3m1 0h1m1 0h2m1 0h2m3 0h1m2 0h3m1 0h3m2 0h1M0 27.5h1m5 0h1m2 0h1m2 0h7m1 0h2m1 0h1m3 0h1M0 28.5h7m1 0h2m1 0h1m2 0h1m2 0h1m1 0h2m2 0h3m1 0h2"/>
            </svg>
        </div>
    </div>
</body>
</html>
