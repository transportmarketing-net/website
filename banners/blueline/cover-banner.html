<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BlueLine Cover</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 2480px;
            height: 3508px;
            background: #0d1b30;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        /* Blue gradient bar at top */
        .accent-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, transparent, #4285f4, transparent);
        }
        /* Circuit-board pattern top-right */
        .circuit-pattern {
            position: absolute;
            top: 0;
            right: 0;
            width: 1000px;
            height: 1200px;
            opacity: 0.06;
            background:
                linear-gradient(90deg, transparent 49%, rgba(66,133,244,0.8) 49%, rgba(66,133,244,0.8) 51%, transparent 51%) 0 0 / 80px 80px,
                linear-gradient(0deg, transparent 49%, rgba(66,133,244,0.8) 49%, rgba(66,133,244,0.8) 51%, transparent 51%) 0 0 / 80px 80px;
            pointer-events: none;
        }
        /* Glowing blue dot */
        .glow-dot {
            position: absolute;
            top: 600px;
            right: 400px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #4285f4;
            box-shadow: 0 0 120px rgba(66,133,244,0.6);
        }
        .content {
            text-align: center;
            position: relative;
            z-index: 2;
        }
        .logo-dots {
            display: flex;
            gap: 40px;
            justify-content: center;
            margin-bottom: 120px;
        }
        .logo-dot {
            width: 180px;
            height: 180px;
            border-radius: 50%;
        }
        .logo-text {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 180px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        /* Circuit icon beside title */
        .icon {
            display: inline-block;
            vertical-align: middle;
            margin-left: 60px;
        }
    </style>
</head>
<body>
    <div class="accent-bar"></div>
    <div class="circuit-pattern"></div>
    <div class="glow-dot"></div>
    <div class="content">
        <div class="logo-dots">
            <div class="logo-dot" style="background: #4285f4;"></div>
            <div class="logo-dot" style="background: #ea4335;"></div>
            <div class="logo-dot" style="background: #34a853;"></div>
        </div>
        <div class="logo-text">
            BLUELINE
            <svg class="icon" width="140" height="140" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <circle cx="100" cy="100" r="80" fill="#4285f4"/>
                <line x1="45" y1="72" x2="155" y2="72" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
                <line x1="45" y1="100" x2="155" y2="100" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
                <line x1="45" y1="128" x2="155" y2="128" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
                <circle cx="75" cy="72" r="6" fill="#4285f4" stroke="#FFFFFF" stroke-width="3"/>
                <circle cx="125" cy="100" r="6" fill="#4285f4" stroke="#FFFFFF" stroke-width="3"/>
                <circle cx="90" cy="128" r="6" fill="#4285f4" stroke="#FFFFFF" stroke-width="3"/>
                <line x1="75" y1="78" x2="75" y2="94" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 5"/>
                <line x1="125" y1="106" x2="125" y2="122" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 5"/>
                <polygon points="148,68 155,72 148,76" fill="#FFFFFF"/>
                <polygon points="148,96 155,100 148,104" fill="#FFFFFF"/>
                <polygon points="148,124 155,128 148,132" fill="#FFFFFF"/>
            </svg>
        </div>
    </div>
</body>
</html>
