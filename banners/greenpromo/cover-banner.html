<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GreenPromo Cover</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 2480px;
            height: 3508px;
            background: #0c1a10;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        /* Green gradient bar at top */
        .accent-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, transparent, #34a853, transparent);
        }
        /* Circular green glow bottom-right */
        .glow {
            position: absolute;
            bottom: -300px;
            right: -300px;
            width: 1000px;
            height: 1000px;
            background: radial-gradient(ellipse at center, rgba(52,168,83,0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .content {
            text-align: center;
            position: relative;
            z-index: 2;
        }
        .logo-dots {
            display: flex;
            gap: 40px;
            justify-content: center;
            margin-bottom: 120px;
        }
        .logo-dot {
            width: 180px;
            height: 180px;
            border-radius: 50%;
        }
        .logo-text {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 180px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        /* Megaphone icon beside title */
        .icon {
            display: inline-block;
            vertical-align: middle;
            margin-left: 60px;
        }
    </style>
</head>
<body>
    <div class="accent-bar"></div>
    <div class="glow"></div>
    <div class="content">
        <div class="logo-dots">
            <div class="logo-dot" style="background: #4285f4;"></div>
            <div class="logo-dot" style="background: #ea4335;"></div>
            <div class="logo-dot" style="background: #34a853;"></div>
        </div>
        <div class="logo-text">
            GREENPROMO
            <svg class="icon" width="140" height="140" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <circle cx="100" cy="100" r="80" fill="#34a853"/>
                <path d="M60,90 L60,115 L90,115 L130,140 L130,65 L90,90 Z" fill="#FFFFFF"/>
                <path d="M130,62 Q155,78 155,100 Q155,122 130,140" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
                <rect x="50" y="93" width="12" height="18" rx="3" fill="#FFFFFF"/>
                <path d="M145,75 Q163,88 163,100 Q163,112 145,127" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
                <path d="M155,65 Q178,82 178,100 Q178,118 155,137" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
                <line x1="62" y1="70" x2="55" y2="58" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
                <line x1="75" y1="65" x2="72" y2="52" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
                <line x1="62" y1="135" x2="55" y2="147" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
            </svg>
        </div>
    </div>
</body>
</html>
