<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GreenPromo Outro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 2480px;
            height: 3508px;
            background: #0c1a10;
            padding: 200px;
            position: relative;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        /* Green pattern background (reduced opacity) */
        .pattern-bg {
            position: absolute;
            bottom: -200px;
            right: -200px;
            width: 1200px;
            height: 1200px;
            background: radial-gradient(ellipse at center, rgba(52,168,83,0.05) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .top-section {
            text-align: center;
            margin-bottom: 400px;
        }
        .logo-dots {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-bottom: 80px;
        }
        .logo-dot {
            width: 120px;
            height: 120px;
            border-radius: 50%;
        }
        .logo-text {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 120px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }
        .brand-icon {
            width: 100px;
            height: 100px;
        }
        .contact-section {
            display: flex;
            flex-direction: column;
            gap: 60px;
            margin-bottom: 600px;
        }
        .contact-row {
            display: flex;
            align-items: center;
            gap: 40px;
        }
        .contact-label {
            font-size: 42px;
            font-weight: 500;
            color: rgba(52,168,83,0.6);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            width: 220px;
        }
        .contact-value {
            font-size: 48px;
            font-weight: 400;
            color: rgba(255,255,255,0.8);
        }
        .bottom-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .footer-text {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 60px;
            font-weight: 700;
            color: rgba(255,255,255,0.15);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .qr-code {
            width: 400px;
            height: 400px;
            background: rgba(52,168,83,0.05);
            border: 4px solid rgba(52,168,83,0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="pattern-bg"></div>

    <div class="top-section">
        <div class="logo-dots">
            <div class="logo-dot" style="background: #4285f4;"></div>
            <div class="logo-dot" style="background: #ea4335;"></div>
            <div class="logo-dot" style="background: #34a853;"></div>
        </div>
        <div class="logo-text">
            GREENPROMO
            <svg class="brand-icon" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <circle cx="100" cy="100" r="80" fill="#34a853"/>
                <path d="M60,90 L60,115 L90,115 L130,140 L130,65 L90,90 Z" fill="#FFFFFF"/>
                <path d="M130,62 Q155,78 155,100 Q155,122 130,140" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
                <rect x="50" y="93" width="12" height="18" rx="3" fill="#FFFFFF"/>
                <path d="M145,75 Q163,88 163,100 Q163,112 145,127" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
                <path d="M155,65 Q178,82 178,100 Q178,118 155,137" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
                <line x1="62" y1="70" x2="55" y2="58" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
                <line x1="75" y1="65" x2="72" y2="52" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
                <line x1="62" y1="135" x2="55" y2="147" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
            </svg>
        </div>
    </div>

    <div class="contact-section">
        <div class="contact-row">
            <div class="contact-label">EMAIL</div>
            <div class="contact-value">info@greenpromo.marketing</div>
        </div>
        <div class="contact-row">
            <div class="contact-label">PHONE</div>
            <div class="contact-value">+30 210 300 7716</div>
        </div>
        <div class="contact-row">
            <div class="contact-label">MOBILE</div>
            <div class="contact-value">+30 698 944 2438</div>
        </div>
        <div class="contact-row">
            <div class="contact-label">WEB</div>
            <div class="contact-value">greenpromo.transportmarketing.net</div>
        </div>
    </div>

    <div class="bottom-section">
        <div class="footer-text">GREENPROMO</div>
        <div class="qr-code">
            <img src="qr-code.png" width="360" height="360" alt="QR Code">
        </div>
    </div>
</body>
</html>
