<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexandros Kourtis — Transport Marketing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #111;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            width: 340px;
            height: 460px;
            background: #0a0a0a;
            border-radius: 16px;
            padding: 40px 32px 32px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.06),
                0 20px 60px rgba(0,0,0,0.5);
        }

        /* subtle noise texture */
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            pointer-events: none;
            border-radius: 16px;
        }

        .logo-dots {
            display: flex;
            gap: 6px;
            margin-bottom: 32px;
        }

        .logo-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .logo-dot--blue { background: #4285f4; }
        .logo-dot--red { background: #ea4335; }
        .logo-dot--green { background: #34a853; }

        .name {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 1.75rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin-bottom: 4px;
        }

        .title-role {
            font-size: 0.75rem;
            font-weight: 400;
            color: rgba(255,255,255,0.35);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 28px;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: rgba(255,255,255,0.08);
            margin-bottom: 24px;
        }

        .info-block {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
            font-weight: 400;
            transition: color 0.2s;
        }

        .info-row:hover { color: rgba(255,255,255,0.8); }

        .info-icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            opacity: 0.4;
        }

        .bottom-section {
            margin-top: auto;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
        }

        .brand-mark {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .brand-name {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            color: rgba(255,255,255,0.25);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .brand-tagline {
            font-size: 0.6rem;
            color: rgba(255,255,255,0.15);
            letter-spacing: 0.05em;
        }

        .qr-code {
            width: 64px;
            height: 64px;
        }

        .qr-code svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Three-dot logo -->
        <div class="logo-dots">
            <div class="logo-dot logo-dot--blue"></div>
            <div class="logo-dot logo-dot--red"></div>
            <div class="logo-dot logo-dot--green"></div>
        </div>

        <!-- Name & Title -->
        <h1 class="name">Alexandros<br>Kourtis</h1>
        <p class="title-role">Director</p>

        <div class="divider"></div>

        <!-- Contact Info -->
        <div class="info-block">
            <a href="mailto:director@transportmarketing.net" class="info-row">

                <span>director@transportmarketing.net</span>
            </a>
            <a href="tel:+306989442438" class="info-row">
                <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>

                <span>transportmarketing.net</span>
            </a>
        </div>

                    <!-- Right side data -->

</body>
</html>
