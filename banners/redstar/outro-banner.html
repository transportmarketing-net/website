<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RedStar Outro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 2480px;
            height: 3508px;
            background: #141414;
            padding: 200px;
            position: relative;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        /* Red pattern background (reduced opacity) */
        .pattern-bg {
            position: absolute;
            top: -200px;
            right: -200px;
            width: 1000px;
            height: 1000px;
            background: radial-gradient(circle, rgba(234,67,53,0.04) 0%, transparent 70%);
            pointer-events: none;
        }
        .top-section {
            text-align: center;
            margin-bottom: 400px;
        }
        .logo-dots {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-bottom: 80px;
        }
        .logo-dot {
            width: 120px;
            height: 120px;
            border-radius: 50%;
        }
        .logo-text {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 120px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }
        .brand-icon {
            width: 100px;
            height: 100px;
        }
        .contact-section {
            display: flex;
            flex-direction: column;
            gap: 60px;
            margin-bottom: 600px;
        }
        .contact-row {
            display: flex;
            align-items: center;
            gap: 40px;
        }
        .contact-label {
            font-size: 42px;
            font-weight: 500;
            color: rgba(234,67,53,0.6);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            width: 220px;
        }
        .contact-value {
            font-size: 48px;
            font-weight: 400;
            color: rgba(255,255,255,0.8);
        }
        .bottom-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .footer-text {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 60px;
            font-weight: 700;
            color: rgba(255,255,255,0.15);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .qr-code {
            width: 400px;
            height: 400px;
            background: rgba(234,67,53,0.05);
            border: 4px solid rgba(234,67,53,0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <div class="pattern-bg"></div>

    <div class="top-section">
        <div class="logo-dots">
            <div class="logo-dot" style="background: #4285f4;"></div>
            <div class="logo-dot" style="background: #ea4335;"></div>
            <div class="logo-dot" style="background: #34a853;"></div>
        </div>
        <div class="logo-text">
            REDSTAR
            <svg class="brand-icon" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <circle cx="100" cy="105" r="80" fill="#EF3E36"/>
                <path d="M18,172 C55,148 85,110 130,45" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
                <path d="M26,180 C62,152 92,112 132,50" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
                <path d="M36,185 C68,156 98,116 133,56" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
                <polygon points="130.0,30.0 133.8,38.5 143.0,37.5 137.5,45.0 143.0,52.5 133.8,51.5 130.0,60.0 126.2,51.5 117.0,52.5 122.5,45.0 117.0,37.5 126.2,38.5" fill="#FFFFFF"/>
            </svg>
        </div>
    </div>

    <div class="contact-section">
        <div class="contact-row">
            <div class="contact-label">EMAIL</div>
            <div class="contact-value">director@transportmarketing.net</div>
        </div>
        <div class="contact-row">
            <div class="contact-label">PHONE</div>
            <div class="contact-value">+30 698 944 2438</div>
        </div>
        <div class="contact-row">
            <div class="contact-label">WEB</div>
            <div class="contact-value">redstar.transportmarketing.net</div>
        </div>
    </div>

    <div class="bottom-section">
        <div class="footer-text">REDSTAR</div>
        <div class="qr-code">
            <img src="qr-code.png" width="360" height="360" alt="QR Code">
        </div>
    </div>
</body>
</html>
