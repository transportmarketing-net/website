<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BlueLine Outro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 2480px;
            height: 3508px;
            background: #0d1b30;
            padding: 200px;
            position: relative;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        /* Circuit pattern background (reduced opacity) */
        .pattern-bg {
            position: absolute;
            top: 0;
            right: 0;
            width: 1200px;
            height: 1200px;
            opacity: 0.03;
            background:
                linear-gradient(90deg, transparent 49%, rgba(66,133,244,0.8) 49%, rgba(66,133,244,0.8) 51%, transparent 51%) 0 0 / 60px 60px,
                linear-gradient(0deg, transparent 49%, rgba(66,133,244,0.8) 49%, rgba(66,133,244,0.8) 51%, transparent 51%) 0 0 / 60px 60px;
            pointer-events: none;
        }
        .top-section {
            text-align: center;
            margin-bottom: 400px;
        }
        .logo-dots {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-bottom: 80px;
        }
        .logo-dot {
            width: 120px;
            height: 120px;
            border-radius: 50%;
        }
        .logo-text {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 120px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }
        .brand-icon {
            width: 100px;
            height: 100px;
        }
        .contact-section {
            display: flex;
            flex-direction: column;
            gap: 60px;
            margin-bottom: 600px;
        }
        .contact-row {
            display: flex;
            align-items: center;
            gap: 40px;
        }
        .contact-label {
            font-size: 42px;
            font-weight: 500;
            color: rgba(66,133,244,0.6);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            width: 220px;
        }
        .contact-value {
            font-size: 48px;
            font-weight: 400;
            color: rgba(255,255,255,0.8);
        }
        .bottom-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .footer-text {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 60px;
            font-weight: 700;
            color: rgba(255,255,255,0.15);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .qr-code {
            width: 400px;
            height: 400px;
            background: rgba(66,133,244,0.05);
            border: 4px solid rgba(66,133,244,0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="pattern-bg"></div>

    <div class="top-section">
        <div class="logo-dots">
            <div class="logo-dot" style="background: #4285f4;"></div>
            <div class="logo-dot" style="background: #ea4335;"></div>
            <div class="logo-dot" style="background: #34a853;"></div>
        </div>
        <div class="logo-text">
            BLUELINE
            <svg class="brand-icon" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <circle cx="100" cy="100" r="80" fill="#4285f4"/>
                <line x1="45" y1="72" x2="155" y2="72" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
                <line x1="45" y1="100" x2="155" y2="100" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
                <line x1="45" y1="128" x2="155" y2="128" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
                <circle cx="75" cy="72" r="6" fill="#4285f4" stroke="#FFFFFF" stroke-width="3"/>
                <circle cx="125" cy="100" r="6" fill="#4285f4" stroke="#FFFFFF" stroke-width="3"/>
                <circle cx="90" cy="128" r="6" fill="#4285f4" stroke="#FFFFFF" stroke-width="3"/>
                <line x1="75" y1="78" x2="75" y2="94" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 5"/>
                <line x1="125" y1="106" x2="125" y2="122" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 5"/>
                <polygon points="148,68 155,72 148,76" fill="#FFFFFF"/>
                <polygon points="148,96 155,100 148,104" fill="#FFFFFF"/>
                <polygon points="148,124 155,128 148,132" fill="#FFFFFF"/>
            </svg>
        </div>
    </div>

    <div class="contact-section">
        <div class="contact-row">
            <div class="contact-label">EMAIL</div>
            <div class="contact-value">director@transportmarketing.net</div>
        </div>
        <div class="contact-row">
            <div class="contact-label">PHONE</div>
            <div class="contact-value">+30 698 944 2438</div>
        </div>
        <div class="contact-row">
            <div class="contact-label">WEB</div>
            <div class="contact-value">blueline.transportmarketing.net</div>
        </div>
    </div>

    <div class="bottom-section">
        <div class="footer-text">BLUELINE</div>
        <div class="qr-code">
            <img src="qr-code.png" width="360" height="360" alt="QR Code">
        </div>
    </div>
</body>
</html>
