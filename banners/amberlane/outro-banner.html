<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AmberLane Outro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 2480px;
            height: 3508px;
            background: #1a1408;
            padding: 200px;
            position: relative;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        /* Amber pattern background (reduced opacity) */
        .pattern-bg {
            position: absolute;
            top: -200px;
            right: -200px;
            width: 1000px;
            height: 1000px;
            background: radial-gradient(circle, rgba(232,145,45,0.04) 0%, transparent 70%);
            pointer-events: none;
        }
        .top-section {
            text-align: center;
            margin-bottom: 400px;
        }
        .logo-dots {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-bottom: 80px;
        }
        .logo-dot {
            width: 120px;
            height: 120px;
            border-radius: 50%;
        }
        .logo-text {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 120px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }
        .brand-icon {
            width: 100px;
            height: 100px;
        }
        .contact-section {
            display: flex;
            flex-direction: column;
            gap: 60px;
            margin-bottom: 600px;
        }
        .contact-row {
            display: flex;
            align-items: center;
            gap: 40px;
        }
        .contact-label {
            font-size: 42px;
            font-weight: 500;
            color: rgba(232,145,45,0.6);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            width: 220px;
        }
        .contact-value {
            font-size: 48px;
            font-weight: 400;
            color: rgba(255,255,255,0.8);
        }
        .bottom-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .footer-text {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 60px;
            font-weight: 700;
            color: rgba(255,255,255,0.15);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .qr-code {
            width: 400px;
            height: 400px;
            background: rgba(232,145,45,0.05);
            border: 4px solid rgba(232,145,45,0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <div class="pattern-bg"></div>

    <div class="top-section">
        <div class="logo-dots">
            <div class="logo-dot" style="background: #4285f4;"></div>
            <div class="logo-dot" style="background: #ea4335;"></div>
            <div class="logo-dot" style="background: #34a853;"></div>
        </div>
        <div class="logo-text">
            AMBERLANE
            <svg class="brand-icon" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <circle cx="100" cy="100" r="80" fill="#E8912D"/>
                <!-- Large gear -->
                <circle cx="90" cy="95" r="32" fill="none" stroke="#FFFFFF" stroke-width="5"/>
                <circle cx="90" cy="95" r="12" fill="#E8912D" stroke="#FFFFFF" stroke-width="3"/>
                <!-- Gear teeth (large) -->
                <rect x="85" y="58" width="10" height="12" rx="2" fill="#FFFFFF"/>
                <rect x="85" y="120" width="10" height="12" rx="2" fill="#FFFFFF"/>
                <rect x="53" y="90" width="12" height="10" rx="2" fill="#FFFFFF"/>
                <rect x="115" y="90" width="12" height="10" rx="2" fill="#FFFFFF"/>
                <rect x="62" y="68" width="10" height="12" rx="2" fill="#FFFFFF" transform="rotate(-45 67 74)"/>
                <rect x="108" y="68" width="10" height="12" rx="2" fill="#FFFFFF" transform="rotate(45 113 74)"/>
                <rect x="62" y="112" width="10" height="12" rx="2" fill="#FFFFFF" transform="rotate(45 67 118)"/>
                <rect x="108" y="112" width="10" height="12" rx="2" fill="#FFFFFF" transform="rotate(-45 113 118)"/>
                <!-- Small gear -->
                <circle cx="125" cy="115" r="20" fill="none" stroke="#FFFFFF" stroke-width="4"/>
                <circle cx="125" cy="115" r="7" fill="#E8912D" stroke="#FFFFFF" stroke-width="2.5"/>
                <!-- Gear teeth (small) -->
                <rect x="121" y="91" width="8" height="9" rx="2" fill="#FFFFFF"/>
                <rect x="121" y="130" width="8" height="9" rx="2" fill="#FFFFFF"/>
                <rect x="101" y="111" width="9" height="8" rx="2" fill="#FFFFFF"/>
                <rect x="140" y="111" width="9" height="8" rx="2" fill="#FFFFFF"/>
                <rect x="106" y="97" width="8" height="9" rx="2" fill="#FFFFFF" transform="rotate(-45 110 101)"/>
                <rect x="136" y="97" width="8" height="9" rx="2" fill="#FFFFFF" transform="rotate(45 140 101)"/>
                <rect x="106" y="127" width="8" height="9" rx="2" fill="#FFFFFF" transform="rotate(45 110 131)"/>
                <rect x="136" y="127" width="8" height="9" rx="2" fill="#FFFFFF" transform="rotate(-45 140 131)"/>
            </svg>
        </div>
    </div>

    <div class="contact-section">
        <div class="contact-row">
            <div class="contact-label">EMAIL</div>
            <div class="contact-value">director@transportmarketing.net</div>
        </div>
        <div class="contact-row">
            <div class="contact-label">PHONE</div>
            <div class="contact-value">+30 698 944 2438</div>
        </div>
        <div class="contact-row">
            <div class="contact-label">WEB</div>
            <div class="contact-value">amberlane.transportmarketing.net</div>
        </div>
    </div>

    <div class="bottom-section">
        <div class="footer-text">AMBERLANE</div>
        <div class="qr-code">
            <img src="qr-code.png" width="360" height="360" alt="QR Code">
        </div>
    </div>
</body>
</html>
