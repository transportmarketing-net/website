<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GreenPromo Section Break</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 900px;
            height: 1600px;
            background: #0c1a10;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        /* Organic curved line */
        .curved-line {
            position: absolute;
            width: 8px;
            height: 1400px;
            background: linear-gradient(180deg, transparent, #34a853 15%, #34a853 85%, transparent);
            opacity: 0.25;
            border-radius: 4px;
            animation: sway 4s ease-in-out infinite;
        }
        @keyframes sway {
            0%, 100% { transform: translateX(-20px); }
            50% { transform: translateX(20px); }
        }
    </style>
</head>
<body>
    <div class="curved-line"></div>
</body>
</html>
