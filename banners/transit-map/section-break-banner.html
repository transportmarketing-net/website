<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transit Map Section Break</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 900px;
            height: 1600px;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        /* Vertical transit line with stations */
        .transit-line {
            position: relative;
            height: 80%;
        }
        .line {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 100%;
            background: linear-gradient(to bottom, #4285f4 0%, #ea4335 50%, #34a853 100%);
            border-radius: 3px;
            opacity: 0.4;
        }
        .station {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 4px solid;
            background: #0a0a0a;
        }
        .station:nth-child(2) { top: 20%; border-color: #4285f4; }
        .station:nth-child(3) { top: 50%; border-color: #ea4335; }
        .station:nth-child(4) { top: 80%; border-color: #34a853; }
    </style>
</head>
<body>
    <div class="transit-line">
        <div class="line"></div>
        <div class="station"></div>
        <div class="station"></div>
        <div class="station"></div>
    </div>
</body>
</html>
