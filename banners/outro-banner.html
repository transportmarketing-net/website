<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transport Marketing — Outro Banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 2480px;
            height: 3508px;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0a0a0a 0%, #111 100%);
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            align-items: stretch;
            justify-content: stretch;
            position: relative;
            overflow: hidden;
        }

        .banner {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 200px 200px;
        }

        /* Transit map background */
        .transit-bg {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.05;
        }

        .transit-bg svg {
            width: 100%;
            height: 100%;
        }

        /* Vignette overlay */
        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.1) 100%);
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Header */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .logo-dots {
            display: flex;
            gap: 30px;
        }

        .logo-dot {
            width: 120px;
            height: 120px;
            border-radius: 50%;
        }

        .logo-dot--blue { background: #4285f4; }
        .logo-dot--red { background: #ea4335; }
        .logo-dot--green { background: #34a853; }

        .header-title {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 120px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            text-align: center;
        }

        /* Middle: Contact info as stations */
        .contact-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            margin-left: 60px;
            position: relative;
        }

        /* Vertical line connecting stations */
        .contact-section::before {
            content: '';
            position: absolute;
            left: 40px;
            top: 60px;
            bottom: 60px;
            width: 20px;
            background: linear-gradient(to bottom, #4285f4 0%, #4285f4 33%, #ea4335 33%, #ea4335 66%, #34a853 66%, #34a853 100%);
            border-radius: 10px;
        }

        .station {
            display: flex;
            align-items: flex-start;
            gap: 80px;
            padding: 40px 0;
            text-decoration: none;
            color: #888;
            position: relative;
            z-index: 1;
        }

        .station-dot {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 6px solid;
            background: #0a0a0a;
            flex-shrink: 0;
            position: relative;
            z-index: 2;
        }

        .station:nth-child(1) .station-dot { border-color: #4285f4; }
        .station:nth-child(2) .station-dot { border-color: #ea4335; }
        .station:nth-child(3) .station-dot { border-color: #34a853; }

        .station-content {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .station-label {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 36px;
            font-weight: 700;
            color: #666;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .station-value {
            font-family: 'Inter', sans-serif;
            font-size: 48px;
            font-weight: 400;
            color: #fff;
            letter-spacing: 0.01em;
        }

        /* Footer */
        .footer {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            width: 100%;
        }

        .footer-brand {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .footer-brand-name {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 40px;
            font-weight: 700;
            color: rgba(255,255,255,0.2);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .footer-brand-tagline {
            font-family: 'Inter', sans-serif;
            font-size: 32px;
            color: rgba(255,255,255,0.1);
            letter-spacing: 0.05em;
        }

        .qr-code {
            width: 400px;
            height: 400px;
            background: #fff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .qr-code svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="banner">
        <!-- Transit map background -->
        <div class="transit-bg">
            <svg viewBox="0 0 2480 3508" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M-200,600 L800,600 Q1000,600 1000,800 L1000,1600 Q1000,1800 1200,1800 L2800,1800" stroke="#4285f4" stroke-width="30" fill="none"/>
                <path d="M-200,2800 L600,2800 Q800,2800 900,2600 L1600,1100 Q1700,900 1900,900 L2800,900" stroke="#ea4335" stroke-width="30" fill="none"/>
                <path d="M1400,-200 L1400,500 Q1400,700 1600,900 L2400,1600 Q2600,1800 2600,2000 L2600,3200 Q2600,3400 2400,3400 L-200,3400" stroke="#34a853" stroke-width="30" fill="none"/>
            </svg>
        </div>

        <!-- Vignette -->
        <div class="vignette"></div>

        <!-- Content -->
        <div class="content">
            <!-- Header -->
            <div class="header">
                <div class="logo-dots">
                    <div class="logo-dot logo-dot--blue"></div>
                    <div class="logo-dot logo-dot--red"></div>
                    <div class="logo-dot logo-dot--green"></div>
                </div>
                <div class="header-title">Transport Marketing</div>
            </div>

            <!-- Contact info as stations -->
            <div class="contact-section">
                <div class="station">
                    <div class="station-dot"></div>
                    <div class="station-content">
                        <span class="station-label">Email</span>
                        <span class="station-value">director@transportmarketing.net</span>
                    </div>
                </div>
                <div class="station">
                    <div class="station-dot"></div>
                    <div class="station-content">
                        <span class="station-label">Phone</span>
                        <span class="station-value">+30 698 944 2438</span>
                    </div>
                </div>
                <div class="station">
                    <div class="station-dot"></div>
                    <div class="station-content">
                        <span class="station-label">Web</span>
                        <span class="station-value">transportmarketing.net</span>
                    </div>
                </div>
            </div>

            <!-- Footer with QR -->
            <div class="footer">
                <div class="footer-brand">
                    <span class="footer-brand-name">Transport Marketing</span>
                </div>
                <div class="qr-code">

                </div>
            </div>
        </div>
    </div>
</body>
</html>
