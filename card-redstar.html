<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedStar — Digital Agency</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #1a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            width: 340px;
            height: 460px;
            background: #141414;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 0 0 1px rgba(234,67,53,0.1),
                0 20px 60px rgba(0,0,0,0.5),
                0 0 80px rgba(234,67,53,0.04);
        }

        /* Red accent bar */
        .accent-bar {
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ea4335, transparent);
            flex-shrink: 0;
        }

        /* Star burst pattern in corner */
        .card::after {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(234,67,53,0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        .card-content {
            padding: 36px 32px 28px;
            display: flex;
            flex-direction: column;
            flex: 1;
            position: relative;
            z-index: 1;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 32px;
        }

        /* Star icon */
        .logo-star {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        .logo-text {
            font-family: 'Manrope', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.02em;
        }

        .tagline {
            font-size: 0.6rem;
            font-weight: 500;
            color: #ea4335;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 28px;
            opacity: 0.7;
        }

        .name {
            font-family: 'Manrope', sans-serif;
            font-size: 1.85rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin-bottom: 4px;
        }

        .title-role {
            font-size: 0.72rem;
            font-weight: 400;
            color: rgba(234,67,53,0.6);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 28px;
        }

        .divider {
            width: 40px;
            height: 2px;
            background: #ea4335;
            margin-bottom: 24px;
            opacity: 0.4;
        }

        .info-block {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: rgba(255,255,255,0.4);
            font-size: 0.78rem;
            font-weight: 400;
            transition: color 0.2s;
        }

        .info-row:hover { color: rgba(255,255,255,0.8); }

        .info-icon {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
            opacity: 0.35;
        }

        .bottom-section {
            margin-top: auto;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
        }

        .brand-mark {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .parent-brand {
            font-size: 0.55rem;
            color: rgba(255,255,255,0.15);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .parent-dots {
            display: inline-flex;
            gap: 3px;
            vertical-align: middle;
        }

        .parent-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            display: inline-block;
        }

        .qr-code {
            width: 58px;
            height: 58px;
        }

        .qr-code svg { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="card">
        <div class="accent-bar"></div>
        <div class="card-content">
            <!-- Logo -->

            <!-- Bottom -->
            <div class="bottom-section">

    </div>
</body>
</html>
