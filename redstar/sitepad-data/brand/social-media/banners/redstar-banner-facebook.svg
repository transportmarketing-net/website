<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 312" width="820" height="312">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17080a"/>
      <stop offset="100%" stop-color="#2a1015"/>
    </linearGradient>
  </defs>
  <!-- Dark background -->
  <rect width="820" height="312" fill="url(#bg-grad)"/>
  <!-- Subtle red accent line at top -->
  <rect x="0" y="0" width="820" height="3" fill="#d62828" opacity="0.8"/>
  <!-- Red circle mark (left side) -->
  <circle cx="200" cy="156" r="70" fill="#EF3E36"/>
  <!-- Trail lines -->
  <path d="M137,218 Q178,178 222,97" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <path d="M143,224 Q183,186 224,107" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M150,228 Q188,192 226,116" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Star -->
  <polygon points="222,82 225.5,90 234,89.5 228.5,95 231,103 222,98 213,103 215.5,95 210,89.5 218.5,90" fill="#FFFFFF"/>
  <!-- Text: RedStar -->
  <text x="320" y="148" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="56" fill="#FFFFFF">RedStar</text>
  <!-- Text: DIGITAL AGENCY -->
  <text x="323" y="180" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="20" letter-spacing="4" fill="#FFFFFF" opacity="0.7">DIGITAL AGENCY</text>
  <!-- Tagline -->
  <text x="323" y="220" font-family="Arial, Helvetica, sans-serif" font-weight="300" font-size="16" fill="#FFFFFF" opacity="0.5">Web Development &amp; Custom Applications | Athens, Greece</text>
  <!-- Website URL -->
  <text x="323" y="250" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="14" fill="#d62828">redstar.transportmarketing.net</text>
  <!-- Bottom accent line -->
  <rect x="0" y="309" width="820" height="3" fill="#d62828" opacity="0.8"/>
</svg>
