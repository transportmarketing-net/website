  <path d="M70 195 Q125 150 178 62" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M80 198 Q130 158 176 70" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
  <!-- 6-pointed star -->
  <polygon points="185,36 189.2,46.4 200,46.4 191.4,53.2 194.6,64 185,57.2 175.4,64 178.6,53.2 170,46.4 180.8,46.4" fill="#FFFFFF"/>
