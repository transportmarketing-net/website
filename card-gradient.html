<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexandros Kourtis — Transport Marketing (Gradient)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #111;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            width: 340px;
            height: 460px;
            background: #0a0a0a;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.06),
                0 20px 60px rgba(0,0,0,0.5);
        }

        /* Gradient accent strip at top */
        .gradient-strip {
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #4285f4 0%, #ea4335 50%, #34a853 100%);
            flex-shrink: 0;
        }

        /* Ambient glow from gradient */
        .card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(180deg,
                rgba(66,133,244,0.06) 0%,
                rgba(234,67,53,0.03) 40%,
                transparent 100%);
            pointer-events: none;
        }

        .card-content {
            padding: 36px 32px 28px;
            display: flex;
            flex-direction: column;
            flex: 1;
            position: relative;
            z-index: 1;
        }

        .logo-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        .logo-dots {
            display: flex;
            gap: 5px;
        }

        .logo-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .logo-dot--blue { background: #4285f4; }
        .logo-dot--red { background: #ea4335; }
        .logo-dot--green { background: #34a853; }

        .logo-text {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            color: rgba(255,255,255,0.2);
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .name {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.02em;
            line-height: 1.05;
            margin-bottom: 6px;
        }

        .title-role {
            font-size: 0.72rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 28px;
            /* Gradient text for the title */
            background: linear-gradient(90deg, #4285f4, #ea4335, #34a853);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .divider {
            width: 48px;
            height: 2px;
            background: linear-gradient(90deg, #4285f4, #ea4335, #34a853);
            margin-bottom: 24px;
            border-radius: 1px;
        }

        .info-block {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: rgba(255,255,255,0.45);
            font-size: 0.78rem;
            font-weight: 400;
            transition: color 0.2s;
        }

        .info-row:hover { color: rgba(255,255,255,0.8); }

        .info-icon {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
            opacity: 0.35;
        }

        .bottom-section {
            margin-top: auto;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding-top: 20px;
        }

        .brand-mark {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .brand-tagline {
            font-size: 0.6rem;
            color: rgba(255,255,255,0.15);
            letter-spacing: 0.06em;
        }

        /* Three colored bars as brand signature */
        .brand-bars {
            display: flex;
            gap: 3px;
        }

        .brand-bar {
            width: 16px;
            height: 3px;
            border-radius: 1.5px;
        }

        .brand-bar--blue { background: #4285f4; }
        .brand-bar--red { background: #ea4335; }
        .brand-bar--green { background: #34a853; }

        .qr-code {
            width: 60px;
            height: 60px;
        }

        .qr-code svg {
            width: 100%;
            height: 100%;
        }

        /* Bottom gradient accent */
        .gradient-strip-bottom {
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #34a853 0%, #ea4335 50%, #4285f4 100%);
            flex-shrink: 0;
            opacity: 0.4;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Top gradient strip -->
        <div class="gradient-strip"></div>

        <div class="card-content">
            <!-- Logo row -->
            <div class="logo-row">
                <div class="logo-dots">
                    <div class="logo-dot logo-dot--blue"></div>
                    <div class="logo-dot logo-dot--red"></div>
                    <div class="logo-dot logo-dot--green"></div>
                </div>
                <span class="logo-text">Transport Marketing</span>
            </div>

            <!-- Name & Title -->
            <h1 class="name">Alexandros<br>Kourtis</h1>
            <p class="title-role">Director</p>

            <!-- Gradient divider -->
            <div class="divider"></div>

            <!-- Contact Info -->
            <div class="info-block">
                <a href="mailto:director@transportmarketing.net" class="info-row">
                    <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 4L12 13L2 4"/></svg>
                    <span>director@transportmarketing.net</span>
                </a>

                    <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
                    <span>+30 698 944 2438</span>
                </a>
                <a href="https://transportmarketing.net" class="info-row" target="_blank">
                    <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
                    <span>transportmarketing.net</span>
                </a>
            </div>

            <!-- Bottom -->
            <div class="bottom-section">
                <div class="brand-mark">
                    <div class="brand-bars">
                        <div class="brand-bar brand-bar--blue"></div>
                        <div class="brand-bar brand-bar--red"></div>
                        <div class="brand-bar brand-bar--green"></div>
                    </div>
                    <span class="brand-tagline">Three brands &middot; One vision</span>
                </div>
                <div class="qr-code">
                    <svg viewBox="0 0 29 29" xmlns="http://www.w3.org/2000/svg">
                        <rect width="29" height="29" fill="#0a0a0a"/>
                        <!-- Position Detection Patterns -->
                        <rect x="0" y="0" width="7" height="7" fill="rgba(255,255,255,0.2)"/>
                        <rect x="1" y="1" width="5" height="5" fill="#0a0a0a"/>

                        <rect x="23" y="1" width="5" height="5" fill="#0a0a0a"/>

                        <rect x="1" y="23" width="5" height="5" fill="#0a0a0a"/>

                        <rect x="8" y="8" width="1" height="1" fill="rgba(255,255,255,0.18)"/>
                        <rect x="10" y="9" width="1" height="1" fill="rgba(255,255,255,0.18)"/>
                        <rect x="12" y="8" width="1" height="1" fill="rgba(255,255,255,0.18)"/>
                        <rect x="9" y="11" width="1" height="1" fill="rgba(255,255,255,0.18)"/>
                        <rect x="11" y="10" width="1" height="1" fill="rgba(255,255,255,0.18)"/>
                        <rect x="13" y="12" width="1" height="1" fill="rgba(255,255,255,0.18)"/>
                        <rect x="14" y="9" width="1" height="1" fill="rgba(255,255,255,0.18)"/>
                        <rect x="16" y="11" width="1" height="1" fill="rgba(255,255,255,0.18)"/>
                        <rect x="15" y="13" width="1" height="1" fill="rgba(255,255,255,0.18)"/>
                        <rect x="18" y="8" width="1" height="1" fill="rgba(255,255,255,0.18)"/>
                        <rect x="20" y="10" width="1" height="1" fill="rgba(255,255,255,0.18)"/>
                        <rect x="19" y="12" width="1" height="1" fill="rgba(255,255,255,0.18)"/>
                        <rect x="8" y="14" width="1" height="1" fill="rgba(255,255,255,0.18)"/>

                        <rect x="12" y="16" width="1" height="1" fill="rgba(255,255,255,0.18)"/>
                        <rect x="9" y="18" width="1" height="1" fill="rgba(255,255,255,0.18)"/>
                        <rect x="11" y="19" width="1" height="1" fill="rgba(255,255,255,0.18)"/>
                        <rect x="14" y="17" width="1" height="1" fill="rgba(255,255,255,0.18)"/>
                        <rect x="16" y="18" width="1" height="1" fill="rgba(255,255,255,0.18)"/>
                        <rect x="18" y="20" width="1" height="1" fill="rgba(255,255,255,0.18)"/>
                        <rect x="20" y="19" width="1" height="1" fill="rgba(255,255,255,0.18)"/>
                        <rect x="22" y="14" width="1" height="1" fill="rgba(255,255,255,0.18)"/>
                        <rect x="24" y="16" width="1" height="1" fill="rgba(255,255,255,0.18)"/>
                        <rect x="23" y="18" width="1" height="1" fill="rgba(255,255,255,0.18)"/>
                        <rect x="25" y="20" width="1" height="1" fill="rgba(255,255,255,0.18)"/>
                        <!-- Alignment pattern -->
                        <rect x="16" y="16" width="5" height="5" fill="rgba(255,255,255,0.18)"/>
                        <rect x="17" y="17" width="3" height="3" fill="#0a0a0a"/>
                        <rect x="18" y="18" width="1" height="1" fill="rgba(255,255,255,0.18)"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Bottom gradient strip (reversed, subtle) -->
        <div class="gradient-strip-bottom"></div>
    </div>
</body>
</html>
