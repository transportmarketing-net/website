<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AmberLane Cover</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 2480px;
            height: 3508px;
            background: #1a1408;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        /* Amber gradient bar at top */
        .accent-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, transparent, #E8912D, transparent);
        }
        /* Radial amber glow top-right */
        .glow {
            position: absolute;
            top: -200px;
            right: -200px;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(232,145,45,0.12) 0%, transparent 70%);
            pointer-events: none;
        }
        /* Dotted grid pattern top-right */
        .dot-grid {
            position: absolute;
            top: 80px;
            right: 80px;
            width: 600px;
            height: 600px;
            background-image: radial-gradient(rgba(232,145,45,0.05) 2px, transparent 2px);
            background-size: 40px 40px;
            pointer-events: none;
        }
        .content {
            text-align: center;
            position: relative;
            z-index: 2;
        }
        .logo-dots {
            display: flex;
            gap: 40px;
            justify-content: center;
            margin-bottom: 120px;
        }
        .logo-dot {
            width: 180px;
            height: 180px;
            border-radius: 50%;
        }
        .logo-text {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 180px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        /* Gear icon beside title */
        .gear-icon {
            display: inline-block;
            vertical-align: middle;
            margin-left: 60px;
        }
    </style>
</head>
<body>
    <div class="accent-bar"></div>
    <div class="glow"></div>
    <div class="dot-grid"></div>
    <div class="content">
        <div class="logo-dots">
            <div class="logo-dot" style="background: #4285f4;"></div>
            <div class="logo-dot" style="background: #ea4335;"></div>
            <div class="logo-dot" style="background: #34a853;"></div>
        </div>
        <div class="logo-text">
            AMBERLANE
            <svg class="gear-icon" width="140" height="140" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <circle cx="100" cy="100" r="80" fill="#E8912D"/>
                <!-- Large gear -->
                <circle cx="90" cy="95" r="32" fill="none" stroke="#FFFFFF" stroke-width="5"/>
                <circle cx="90" cy="95" r="12" fill="#E8912D" stroke="#FFFFFF" stroke-width="3"/>
                <!-- Gear teeth (large) -->
                <rect x="85" y="58" width="10" height="12" rx="2" fill="#FFFFFF"/>
                <rect x="85" y="120" width="10" height="12" rx="2" fill="#FFFFFF"/>
                <rect x="53" y="90" width="12" height="10" rx="2" fill="#FFFFFF"/>
                <rect x="115" y="90" width="12" height="10" rx="2" fill="#FFFFFF"/>
                <rect x="62" y="68" width="10" height="12" rx="2" fill="#FFFFFF" transform="rotate(-45 67 74)"/>
                <rect x="108" y="68" width="10" height="12" rx="2" fill="#FFFFFF" transform="rotate(45 113 74)"/>
                <rect x="62" y="112" width="10" height="12" rx="2" fill="#FFFFFF" transform="rotate(45 67 118)"/>
                <rect x="108" y="112" width="10" height="12" rx="2" fill="#FFFFFF" transform="rotate(-45 113 118)"/>
                <!-- Small gear -->
                <circle cx="125" cy="115" r="20" fill="none" stroke="#FFFFFF" stroke-width="4"/>
                <circle cx="125" cy="115" r="7" fill="#E8912D" stroke="#FFFFFF" stroke-width="2.5"/>
                <!-- Gear teeth (small) -->
                <rect x="121" y="91" width="8" height="9" rx="2" fill="#FFFFFF"/>
                <rect x="121" y="130" width="8" height="9" rx="2" fill="#FFFFFF"/>
                <rect x="101" y="111" width="9" height="8" rx="2" fill="#FFFFFF"/>
                <rect x="140" y="111" width="9" height="8" rx="2" fill="#FFFFFF"/>
                <rect x="106" y="97" width="8" height="9" rx="2" fill="#FFFFFF" transform="rotate(-45 110 101)"/>
                <rect x="136" y="97" width="8" height="9" rx="2" fill="#FFFFFF" transform="rotate(45 140 101)"/>
                <rect x="106" y="127" width="8" height="9" rx="2" fill="#FFFFFF" transform="rotate(45 110 131)"/>
                <rect x="136" y="127" width="8" height="9" rx="2" fill="#FFFFFF" transform="rotate(-45 140 131)"/>
            </svg>
        </div>
    </div>
</body>
</html>
