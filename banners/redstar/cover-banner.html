<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RedStar Cover</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 2480px;
            height: 3508px;
            background: #141414;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        /* Red gradient bar at top */
        .accent-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, transparent, #ea4335, transparent);
        }
        /* Radial red glow top-right */
        .glow {
            position: absolute;
            top: -200px;
            right: -200px;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(234,67,53,0.12) 0%, transparent 70%);
            pointer-events: none;
        }
        .content {
            text-align: center;
            position: relative;
            z-index: 2;
        }
        .logo-dots {
            display: flex;
            gap: 40px;
            justify-content: center;
            margin-bottom: 120px;
        }
        .logo-dot {
            width: 180px;
            height: 180px;
            border-radius: 50%;
        }
        .logo-text {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 180px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        /* Star icon beside title */
        .star-icon {
            display: inline-block;
            vertical-align: middle;
            margin-left: 60px;
        }
    </style>
</head>
<body>
    <div class="accent-bar"></div>
    <div class="glow"></div>
    <div class="content">
        <div class="logo-dots">
            <div class="logo-dot" style="background: #4285f4;"></div>
            <div class="logo-dot" style="background: #ea4335;"></div>
            <div class="logo-dot" style="background: #34a853;"></div>
        </div>
        <div class="logo-text">
            REDSTAR
            <svg class="star-icon" width="140" height="140" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <circle cx="100" cy="105" r="80" fill="#EF3E36"/>
                <path d="M18,172 C55,148 85,110 130,45" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
                <path d="M26,180 C62,152 92,112 132,50" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
                <path d="M36,185 C68,156 98,116 133,56" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
                <polygon points="130.0,30.0 133.8,38.5 143.0,37.5 137.5,45.0 143.0,52.5 133.8,51.5 130.0,60.0 126.2,51.5 117.0,52.5 122.5,45.0 117.0,37.5 126.2,38.5" fill="#FFFFFF"/>
            </svg>
        </div>
    </div>
</body>
</html>
