<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transit Map Cover</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 2480px;
            height: 3508px;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        /* Transit lines background */
        .transit-bg {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.15;
        }
        .transit-bg svg {
            width: 100%;
            height: 100%;
        }
        .content {
            text-align: center;
            position: relative;
            z-index: 2;
        }
        .logo-dots {
            display: flex;
            gap: 40px;
            justify-content: center;
            margin-bottom: 120px;
        }
        .logo-dot {
            width: 180px;
            height: 180px;
            border-radius: 50%;
        }
        .logo-text {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 180px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <!-- Transit map background lines -->
    <div class="transit-bg">
        <svg viewBox="0 0 2480 3508" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Blue line: horizontal sweeping -->
            <path d="M-100,600 L600,600 Q800,600 800,800 L800,1400 Q800,1600 1000,1600 L2600,1600" stroke="#4285f4" stroke-width="20" fill="none"/>
            <!-- Red line: diagonal crossing -->
            <path d="M-100,2800 L500,2800 Q700,2800 850,2400 L1400,1000 Q1550,600 1800,600 L2600,600" stroke="#ea4335" stroke-width="20" fill="none"/>
            <!-- Green line: sweeping vertical -->
            <path d="M1200,-100 L1200,600 Q1200,800 1400,1000 L1900,1500 Q2100,1700 2100,1900 L2100,3000 Q2100,3200 1900,3200 L-100,3200" stroke="#34a853" stroke-width="20" fill="none"/>

            <!-- Station dots -->
            <circle cx="600" cy="600" r="40" fill="#0a0a0a" stroke="#4285f4" stroke-width="15"/>
            <circle cx="800" cy="1200" r="35" fill="#0a0a0a" stroke="#4285f4" stroke-width="15"/>
            <circle cx="1100" cy="1800" r="40" fill="#0a0a0a" stroke="#ea4335" stroke-width="15"/>
            <circle cx="1800" cy="600" r="35" fill="#0a0a0a" stroke="#ea4335" stroke-width="15"/>
            <circle cx="1600" cy="1200" r="40" fill="#0a0a0a" stroke="#34a853" stroke-width="15"/>
            <circle cx="2100" cy="2400" r="35" fill="#0a0a0a" stroke="#34a853" stroke-width="15"/>

            <!-- Interchange points -->
            <circle cx="1400" cy="1000" r="60" fill="#0a0a0a" stroke="rgba(255,255,255,0.3)" stroke-width="15"/>
            <circle cx="1400" cy="1000" r="25" fill="rgba(255,255,255,0.2)"/>
        </svg>
    </div>

    <div class="content">
        <div class="logo-dots">
            <div class="logo-dot" style="background: #4285f4;"></div>
            <div class="logo-dot" style="background: #ea4335;"></div>
            <div class="logo-dot" style="background: #34a853;"></div>
        </div>
        <div class="logo-text">TRANSPORT MARKETING</div>
    </div>
</body>
</html>
