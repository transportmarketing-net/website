<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dark Minimal Outro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 2480px;
            height: 3508px;
            background: #0a0a0a;
            padding: 200px;
            position: relative;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        /* Noise texture */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            pointer-events: none;
        }
        .top-section {
            text-align: center;
            margin-bottom: 400px;
            position: relative;
            z-index: 1;
        }
        .logo-dots {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-bottom: 80px;
        }
        .logo-dot {
            width: 120px;
            height: 120px;
            border-radius: 50%;
        }
        .logo-text {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 120px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .contact-section {
            display: flex;
            flex-direction: column;
            gap: 60px;
            margin-bottom: 600px;
            position: relative;
            z-index: 1;
        }
        .contact-row {
            display: flex;
            align-items: center;
            gap: 40px;
        }
        .contact-label {
            font-size: 42px;
            font-weight: 500;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            width: 220px;
        }
        .contact-value {
            font-size: 48px;
            font-weight: 400;
            color: rgba(255,255,255,0.7);
        }
        .bottom-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            position: relative;
            z-index: 1;
        }
        .footer-text {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 60px;
            font-weight: 700;
            color: rgba(255,255,255,0.12);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .qr-code {
            width: 400px;
            height: 400px;
            background: rgba(255,255,255,0.02);
            border: 3px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="top-section">
        <div class="logo-dots">
            <div class="logo-dot" style="background: #4285f4;"></div>
            <div class="logo-dot" style="background: #ea4335;"></div>
            <div class="logo-dot" style="background: #34a853;"></div>
        </div>
        <div class="logo-text">TRANSPORT MARKETING</div>
    </div>

    <div class="contact-section">
        <div class="contact-row">
            <div class="contact-label">EMAIL</div>
            <div class="contact-value">director@transportmarketing.net</div>
        </div>
        <div class="contact-row">
            <div class="contact-label">PHONE</div>
            <div class="contact-value">+30 698 944 2438</div>
        </div>
        <div class="contact-row">
            <div class="contact-label">WEB</div>
            <div class="contact-value">transportmarketing.net</div>
        </div>
    </div>

    <div class="bottom-section">
        <div class="footer-text">TRANSPORT MARKETING</div>
        <div class="qr-code">
            <svg viewBox="0 0 29 29" width="360" height="360" xmlns="http://www.w3.org/2000/svg">
                <rect width="29" height="29" fill="#0a0a0a"/>
                <rect x="0" y="0" width="7" height="7" fill="rgba(255,255,255,0.25)"/>
                <rect x="1" y="1" width="5" height="5" fill="#0a0a0a"/>
                <rect x="2" y="2" width="3" height="3" fill="rgba(255,255,255,0.25)"/>
                <rect x="22" y="0" width="7" height="7" fill="rgba(255,255,255,0.25)"/>
                <rect x="23" y="1" width="5" height="5" fill="#0a0a0a"/>
                <rect x="24" y="2" width="3" height="3" fill="rgba(255,255,255,0.25)"/>
                <rect x="0" y="22" width="7" height="7" fill="rgba(255,255,255,0.25)"/>
                <rect x="1" y="23" width="5" height="5" fill="#0a0a0a"/>
                <rect x="2" y="24" width="3" height="3" fill="rgba(255,255,255,0.25)"/>
                <rect x="16" y="16" width="5" height="5" fill="rgba(255,255,255,0.2)"/>
                <rect x="17" y="17" width="3" height="3" fill="#0a0a0a"/>
                <rect x="18" y="18" width="1" height="1" fill="rgba(255,255,255,0.2)"/>
            </svg>
        </div>
    </div>
</body>
</html>
