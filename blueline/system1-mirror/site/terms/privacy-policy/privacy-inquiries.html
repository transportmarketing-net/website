/* BlueLine menu, header and product carousel behavior. */
(function () {
    function initialize() {
        document.body.classList.remove('no-js');

        var menu = document.querySelector('.hamburger');
        var navigation = document.querySelector('.main-nav');
        var previousScroll = 0;
        var viewportHeight = Math.max(document.documentElement.clientHeight, window.innerHeight || 0);
        document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
        header.classList.add('header--showing');
        function showHeader() {
            header.classList.remove('header--hiding');
            header.classList.add('header--showing');
        }
        function closeMenu() {
            menu.checked = false;
            document.body.classList.remove('hide-overflow');
        }
        menu.addEventListener('change', function () {
            document.body.classList.toggle('hide-overflow', menu.checked);
            if (menu.checked) showHeader();
        });
        navigation.addEventListener('click', function (event) {
            if (event.target.closest('a')) closeMenu();
        });
        header.addEventListener('keydown', function (event) {
            if (event.key === 'Escape' && menu.checked) {
                closeMenu();
                menu.focus();
            }
        });
        window.addEventListener('scroll', function () {
            var currentScroll = window.scrollY || document.documentElement.scrollTop;

                previousScroll = currentScroll;
                header.classList.remove('header--showing');
                header.classList.add('header--hiding');
            } else if (currentScroll < previousScroll - viewportHeight * 0.01) {
                previousScroll = currentScroll;
                showHeader();
            }

        if (document.querySelector('.brands__swiper-container') && typeof Swiper === 'function') {

                carousel.slideTo(target, 0);
                document.querySelector('.brands').scrollIntoView();
            }
        }
        window.addEventListener('hashchange', revealProduct);
        revealProduct();
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initialize);
    else initialize();
}());
